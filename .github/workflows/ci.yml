name: Tests

# Runs on pull requests, including from forks. GitHub gives fork pull requests no secrets and a
# read-only token, and this workflow neither uses secrets nor deploys. Do not change this to
# pull_request_target, which would run fork code with access to secrets.
on:
  pull_request:

permissions: {}

jobs:
  test:
    name: "Tests"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest==8.4.2

      - name: Python tests
        run: python -m pytest tests/

      - name: Lookup function tests
        run: node --test tests/node/lookup.test.mjs tests/node/history.test.mjs
