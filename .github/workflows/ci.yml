name: Tests

# Runs on pull requests, including from forks. GitHub gives fork pull requests no secrets and a
# read-only token, and this workflow neither uses secrets nor deploys. Do not change this to
# pull_request_target, which would run fork code with access to secrets.
on:
  pull_request:

permissions: {}

jobs:
  test:
    name: "Tests"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest==8.4.2

      - name: Python tests
        run: python -m pytest tests/

      - name: Lookup function tests
        run: node --test tests/node/lookup.test.mjs
