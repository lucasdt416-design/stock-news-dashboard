name: Daily Stock News Dashboard Run

on:
  schedule:
    # Runs Monday through Friday at 11:00 UTC (6:00 AM EST / 7:00 AM EDT)
    - cron: '0 11 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI anytime
  push:
    branches:
      - main
    paths:
      - 'README.md'
      - 'data/watchlist.yaml'
      - 'collectors/**'
      - 'pipeline/**'
      - 'functions/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/daily-run.yml'

# Nothing by default; each job asks for what it needs.
permissions: {}

jobs:
  build-and-deploy:
    name: "Run Pipeline & Deploy"
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 🟢 Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install -r requirements.txt pytest==8.4.2

      - name: 🧪 Run Automated Regression & Signature Tests
        run: |
          python -m pytest tests/

      - name: 🧪 Test the Lookup Function
        run: node --test tests/node/lookup.test.mjs

      - name: 🗄️ Restore Database Cache (Historical Filings & Dedup History)
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: restore-db
        with:
          path: data/dashboard.db
          key: "dashboard-db-${{ github.run_id }}"
          restore-keys: |
            dashboard-db-

      - name: 🚀 Run Pipeline (Collect, Deduplicate, Score, Health Check, Render)
        id: run_pipeline
        env:
          SEC_EDGAR_USER_AGENT: "${{ secrets.SEC_EDGAR_USER_AGENT || 'StockNewsDashboard/1.0 (contact: admin@stocknewsdashboard.local)' }}"
          # Gemini's free plan allows only a few requests a day. A merge also runs this job, so only the
          # daily schedule and manual runs ask it; stories left with a plain summary are sent next time.
          GEMINI_API_KEY: "${{ github.event_name != 'push' && secrets.GEMINI_API_KEY || '' }}"
          FINNHUB_API_KEY: "${{ secrets.FINNHUB_API_KEY }}"
        run: |
          python scripts/run_local.py --fail-on-critical

      - name: 💾 Save Updated Database Cache
        if: always() && steps.run_pipeline.outcome == 'success'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: data/dashboard.db
          key: "dashboard-db-${{ github.run_id }}"

      - name: 📦 Upload Static Site Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stock-news-dashboard-site
          path: site/
          retention-days: 14

      - name: 🔎 Check Deployment Is Configured
        id: deploy_config
        env:
          CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}"
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; fi

      - name: 🛡️ Check Security Headers Were Generated
        run: |
          # Render writes this with hashes for this exact build. Fall back only if it is missing.
          [ -f site/_headers ] || cp deploy/_headers site/_headers
          grep -q "Content-Security-Policy" site/_headers

      # This is the only step that can see the Cloudflare token.
      - name: 🌐 Deploy to Cloudflare Pages
        if: steps.deploy_config.outputs.enabled == 'true'
        env:
          CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}"
          CLOUDFLARE_ACCOUNT_ID: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
          CLOUDFLARE_PROJECT_NAME: "${{ secrets.CLOUDFLARE_PROJECT_NAME || 'stock-news-dashboard' }}"
          FINNHUB_API_KEY: "${{ secrets.FINNHUB_API_KEY }}"
          WRANGLER: "wrangler@4.151.2"
        run: |
          echo "============================================================"
          echo "🌐 Starting Cloudflare Pages Deployment"
          echo "============================================================"

          # Step 1: Ensure the Cloudflare Pages project exists & sync secrets
          echo "Checking / creating project on Cloudflare Pages..."
          npx --yes "$WRANGLER" pages project create "$CLOUDFLARE_PROJECT_NAME" --production-branch=main || true

          if [ -n "$FINNHUB_API_KEY" ]; then
            echo "Syncing the Finnhub secret to Cloudflare Pages..."
            printf '%s' "$FINNHUB_API_KEY" | npx --yes "$WRANGLER" pages secret put FINNHUB_API_KEY --project-name="$CLOUDFLARE_PROJECT_NAME" || true
          fi

          # Step 2: Deploy the static site directory (functions/ is bundled automatically by wrangler from repo root)
          echo "Deploying site/ directory and serverless functions to Cloudflare Pages..."
          npx --yes "$WRANGLER" pages deploy site --project-name="$CLOUDFLARE_PROJECT_NAME" --branch=main --commit-dirty=true
