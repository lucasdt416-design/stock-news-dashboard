name: Something's broken
description: A page doesn't load, looks wrong, or doesn't do what it should.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you saw instead. Screenshots help.
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Page and device
      placeholder: Moves page, iPhone, Safari, dark mode
